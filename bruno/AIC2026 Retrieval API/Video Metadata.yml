info:
  name: Video Metadata
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/videos/:video_id"
  params:
    - name: video_id
      value: L26_V355
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/videos/:video_id"
      method: GET
      params:
        - name: video_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "video_id": "",
            "frame_count": 0,
            "first_frame_index": 0,
            "last_frame_index": 0
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/videos/:video_id"
      method: GET
      params:
        - name: video_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
