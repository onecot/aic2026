info:
  name: Video Frames
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/videos/:video_id/frames"
  params:
    - name: video_id
      value: L26_V355
      type: path
    - name: offset
      value: "0"
      type: query
    - name: limit
      value: "100"
      type: query
    - name: center
      value: ""
      type: query
      disabled: true
    - name: radius
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/videos/:video_id/frames"
      method: GET
      params:
        - name: video_id
          value: ""
          type: path
        - name: offset
          value: "0"
          type: query
        - name: limit
          value: "100"
          type: query
        - name: center
          value: ""
          type: query
          disabled: true
        - name: radius
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "video_id": "",
            "frames": [
              {
                "keyframe_ordinal": 0,
                "frame_index": 0,
                "pts_time": 0,
                "fps": 0
              }
            ],
            "total": 0
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/videos/:video_id/frames"
      method: GET
      params:
        - name: video_id
          value: ""
          type: path
        - name: offset
          value: "0"
          type: query
        - name: limit
          value: "100"
          type: query
        - name: center
          value: ""
          type: query
          disabled: true
        - name: radius
          value: ""
          type: query
          disabled: true
    response:
      status: 422
      statusText: Unprocessable Entity
