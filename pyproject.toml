[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026"
version = "0.1.0"
description = "AIC 2026 video retrieval: production core, offline asset toolchain, and HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AIC 2026 Team" }]
keywords = ["aic", "retrieval", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Production model runtime (Jina CLIP v2 encoder).
jina = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.49",
    "tokenizers>=0.22",
    "sentencepiece>=0.1.96",
    "Pillow>=9.0",
    "timm>=0.9",
    "einops>=0.6",
    "requests>=2.28",
]
# QA answer-generation VLM (Apple Silicon MLX port of jina-vlm).
vlm-mlx = [
    "mlx>=0.22",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@main",
    "transformers>=4.49",
    "Pillow>=9.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "Pillow>=9.0",
]
ui = [
    "streamlit>=1.49",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
