[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026"
version = "0.1.0"
description = "AIC 2026 research project: reproducible pipeline foundation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AIC 2026 Team" }]
keywords = ["aic", "research", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
openclip = [
    "open-clip-torch>=2.24",
]
jina = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.49",
    "tokenizers>=0.22",
    "sentencepiece>=0.1.96",
    "Pillow>=9.0",
    "timm>=0.9",
    "einops>=0.6",
    "requests>=2.28",
]
caption-mlx = [
    "mlx>=0.22",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@main",
    "transformers>=4.49",
    "Pillow>=9.0",
]
ocr = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "numpy>=1.24",
    "Pillow>=9.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "Pillow>=9.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
aic2026 = "aic2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
