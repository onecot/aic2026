# Experiment: Jina CLIP v2 (jina-clip:jina-clip-v2:jinaai/jina-clip-v2).
#
# Jina CLIP v2 is a bilingual multimodal model whose image and text embeddings
# share one 1024-dimensional embedding space (float32, L2-normalized). This
# config selects that model as the ACTIVE backend for query encoding so QA
# retrieval can run against the ``jina-v2-full`` index built from the
# ``outputs/embeddings_jina_v2`` embedding artifact.
#
# The embedding-space identity is constructed from the fields below:
#
#   space_id = jina-clip:jina-clip-v2:jinaai/jina-clip-v2:fp32:l2:
#              jina-clip-v2-preprocess-v1:jina-clip-v2-tokenizer-v1
#
# The ``models.openclip`` section is kept for backward compatibility with the
# shared config loader and is NOT used when ``models.jina`` is present.
# The full embedding space (including this model and checkpoint) is recorded
# in every embedding/index/prediction artifact, so artifacts built with
# different experiment configs are never silently mixed.

data:
  raw_dir: data/raw/aic2026_batch1
  indexes_dir: data/interim/indexes

models:
  openclip:
    backend: openclip
    model_name: ViT-L-14
    pretrained: laion2b_s32b_b82k
    device: auto
    precision: fp32
    normalization: l2
    # Project-managed processing/tokenizer revision labels; bump them when
    # changing the convention for an otherwise identical model/checkpoint.
    preprocessing_id: openclip-default-v1
    tokenizer_id: openclip-default-v1
  jina:
    backend: jina-clip
    model_name: jina-clip-v2
    pretrained: jinaai/jina-clip-v2
    device: auto
    precision: fp32
    normalization: l2
    # Project-managed processing/tokenizer revision labels; bump them when
    # changing the convention for an otherwise identical model/checkpoint.
    preprocessing_id: jina-clip-v2-preprocess-v1
    tokenizer_id: jina-clip-v2-tokenizer-v1