# Default configuration for the AIC 2026 project.
#
# The single ``models`` block is the active production backend:
# Jina CLIP v2, matching the production retrieval stack
# (data/interim/indexes/jina-v2-full built from outputs/embeddings_jina_v2).
# The full embedding-space identity recorded below is embedded in every
# embedding/index/prediction artifact, so vectors from a different model are
# never silently mixed.
#
# Override mechanism: pass an alternative YAML with the same schema via
# --config / load_config(path). There are no layered experiment configs.

project:
  name: aic2026
  version: 0.1.0

data:
  # Raw BTC-provided dataset root (rebuild input for keyframes/embeddings).
  raw_dir: data/raw/aic2026_batch1
  # Root directory containing index artifacts.
  indexes_dir: data/interim/indexes
  # Materialized keyframe artifact: authoritative frame metadata + images.
  keyframes_dir: data/keyframes/adaptive_sbd_v1

models:
  backend: jina-clip
  model_name: jina-clip-v2
  pretrained: jinaai/jina-clip-v2
  device: cpu
  precision: fp32
  normalization: l2
  # Project-managed processing/tokenizer revision labels; bump them when
  # changing the convention for an otherwise identical model/checkpoint.
  preprocessing_id: jina-clip-v2-preprocess-v1
  tokenizer_id: jina-clip-v2-tokenizer-v1
