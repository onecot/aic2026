# Default configuration for the AIC 2026 project.
#
# This is the base layer of the configuration precedence model:
#   base/default configuration
#         -> environment or experiment configuration
#         -> explicit CLI overrides
#
# Processing stages and experiment parameters will be added here
# as the pipeline is implemented.

project:
  name: aic2026
  version: 0.1.0

data:
  # Path to the raw BTC-provided dataset root, relative to the repo root.
  raw_dir: data/raw/aic2026_batch1
  # Root directory for derived artifacts (e.g. indexes), relative to the
  # repo root. Each index artifact lives in its own subdirectory.
  indexes_dir: data/interim/indexes